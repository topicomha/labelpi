# labelpi example config. Copy to config/printers.toml and set the MACs.
# Values come from the Milestone 0 hardware spike (docs/SPEC.md §10).
# VERIFY = not measured yet.

[server]
host = "0.0.0.0"
port = 8080
max_upload_mb = 5

# ---------------------------------------------------------------------------
[[printers]]
id = "brother"
display_name = "Brother PT-P300BT"
type = "brother_pt"            # brother_pt | phomemo | mock
address = "AA:BB:CC:DD:EE:FF"  # Bluetooth MAC (Classic; pair + trust once)
dpi = 180                      # across the tape; along it one line = 0.149 mm

  # Continuous tape: height is fixed, length follows the content.
  # The printer always takes a 128-px raster; print_height_px is the band
  # that actually reaches the tape, centred in those 128 px.
  [[printers.labels]]
  id = "tze-12"
  name = "12 mm tape"
  tape_width_mm = 12
  print_height_px = 64         # measured: rows 32-95
  continuous = true
  margin_mm = 2

  [[printers.labels]]
  id = "tze-9"
  name = "9 mm tape"
  tape_width_mm = 9
  print_height_px = 48         # VERIFY (Ircama's value)
  continuous = true
  margin_mm = 2

  [[printers.labels]]
  id = "tze-6"
  name = "6 mm tape"
  tape_width_mm = 6
  print_height_px = 32         # VERIFY (Ircama's value)
  continuous = true
  margin_mm = 2

# ---------------------------------------------------------------------------
[[printers]]
id = "d30"
display_name = "Phomemo D30"
type = "phomemo"
address = "11:22:33:44:55:66"  # BLE address; advertises as "D30", no pairing
dpi = 203                      # 8 px/mm; print head is 96 px = 12 mm wide

  # Fixed die-cut labels. Anything wider than 12 mm still only gets 12 mm printed.
  [[printers.labels]]
  id = "12x40"
  name = "12 x 40 mm"
  width_mm = 12
  length_mm = 40               # VERIFY - our roll may be 12 x 50
  offset_mm = 0                # VERIFY - printing started ~12 mm into the label
  continuous = false

# ---------------------------------------------------------------------------
# Templates. labelpi starts with Today's date, Opened, Food, Freezer and
# Container built in, and you can add/edit/delete templates on the web page
# (saved in config/settings.json). Anything here is added to the starting
# list; the same id as a built-in one replaces it.
#
#   {field:Name}          a box on the page to type into
#   {date:%d %b %Y}       today (strftime format); {time:%H:%M} works too
#   {date+3d:%d %b}       today + 3 days; also w (weeks), m (months), y (years),
#                         and minus: {date-1w:...}. A bare number is days.
[[templates]]
id = "leftovers"
name = "Leftovers"
text = "{field:Dish}\nCooked {date:%a %d %b}\nEat by {date+2d:%a %d %b}"
